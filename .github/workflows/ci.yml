# Everything after the dependency install runs offline from the committed inputs: no data, paper or
# standard is downloaded, and no step needs a secret.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  MPLBACKEND: Agg

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the pinned dependencies
        run: pip install -r requirements.txt
      - name: Tests, including the drift tests (committed results, README, note and workbook against a fresh run)
        run: python -m pytest -q
      - name: Generated documents are up to date
        run: python scripts/build_docs.py --check
      - name: Whole pipeline, results, figures and workbook, rebuilt into a scratch folder
        run: python -m tunnelscreen.pipeline --samples 500 --out "$RUNNER_TEMP/rebuild"
      - name: Technical note builds to four pages
        run: python scripts/build_note.py "$RUNNER_TEMP/technical_note.pdf"

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the pinned dependencies
        run: pip install -r requirements.txt
      - name: Every planted error must make a test fail
        run: python scripts/mutate.py --record ci --require-all
